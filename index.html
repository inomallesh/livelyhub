<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>livelyhub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Applied before the stylesheet paints, so there's no flash of the
    // wrong theme on load.
    (function () {
      var theme = localStorage.getItem("lh_theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <main class="home-wrap">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme"></button>
    <button id="menuToggleBtn" class="theme-toggle menu-toggle-home" aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="home-card">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 4l-6 8 6 8M16 4l6 8-6 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>livelyhub</h1>
      <p class="home-tag">One shared room. One pen at a time.</p>

      <div class="identity-block">
        <input id="nameInput" class="input-field name-input" maxlength="20" placeholder="Your name" />
      </div>

      <button id="createBtn" class="btn btn-primary">
        <span id="createBtnLabel">Create a room</span>
      </button>

      <div class="divider">or join with a code</div>

      <div class="join-row">
        <input id="joinInput" class="input-field code-input" maxlength="6" inputmode="numeric" placeholder="123456" />
        <button id="joinBtn" class="btn btn-secondary">Join</button>
      </div>

      <p id="errorMsg" class="error-msg" style="display:none;"></p>
    </div>

    <div id="menuPopup" class="menu-popup" hidden></div>
  </main>

  <script type="module" src="js/home.js"></script>
</body>
</html>
