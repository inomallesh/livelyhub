<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="in_rwmksUb8Id8rYciMjhj3jP2v99Mj2RBwsO97Yg6Y" />
  <title>livelyhub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Kalam:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-orbs"></div>

  <main class="home-wrap">
    <div class="home-card glass">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4c-4 0-9 2-12 6-2 2.5-3 5-3.5 8.5M20 4c0 4-2 9-6 12-2.5 2-5 3-8.5 3.5M20 4L6 18" stroke="#ff8a1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>livelyhub</h1>
      <p class="home-tag">One shared room. One pen at a time.<br />Everyone else watches, chats, and waits their turn.</p>

      <div class="identity-block">
        <input id="nameInput" class="input-glass name-input" maxlength="20" placeholder="Your name" />
        <label class="avatar-label">Choose your avatar</label>
        <div id="avatarGrid" class="avatar-grid"></div>
      </div>

      <button id="createBtn" class="btn btn-primary">
        <span id="createBtnLabel">Create a room</span>
      </button>

      <div class="divider">or join with a code</div>

      <div class="join-row">
        <input id="joinInput" class="input-glass" maxlength="6" inputmode="numeric" placeholder="123456" />
        <button id="joinBtn" class="btn btn-secondary">Join</button>
      </div>

      <p id="errorMsg" class="error-msg" style="display:none;"></p>
    </div>
  </main>

  <script type="module" src="js/home.js"></script>
</body>
</html>
